# Binary Academy — Codemagic CI/CD
#
# This file is the source of truth for the iOS release pipeline.
#
# It replaces two things that were actively harmful:
#   * The old `codemagic.yaml`, which ran `flutter build ios --no-codesign` and
#     emitted an UNSIGNED Runner.app. That artifact can never reach TestFlight,
#     so anyone reading the repo got a false picture of how releases happen.
#     The real pipeline lived only in the Codemagic web UI.
#   * Signing assets that only existed on someone's laptop. A hand-uploaded
#     .mobileprovision goes stale between builds, and this project builds
#     months apart, so every capability change or cert expiry became a build
#     failure fixable only by re-exporting a file from a Mac — which nobody
#     here has. The certificate and profile are now held by Codemagic, pulled
#     from Apple through the App Store Connect integration, and refreshed with
#     a button. `ios_signing` names them; see the block below for why it does
#     not use the fetch-per-build form.
#
# ── ONE-TIME SETUP — see docs/RELEASE.md for the full walkthrough ────────────
#   1. developer.apple.com → Identifiers → com.cristians.b1nary
#      → tick "Sign In with Apple" → Save.
#      (Nothing on the CI side can enable a capability the App ID does not
#      have. This one tick is unavoidable and manual. Note it INVALIDATES every
#      existing provisioning profile — regenerate the profile afterwards and
#      re-fetch it into Codemagic, or the build fails with "No matching
#      profiles found".)
#   2. DONE — the Apple Developer Portal integration is already connected on
#      the Codemagic personal account under the name "Codemagic"
#      (Key ID 49ACZ234H8, App Manager access). `integrations` below matches it.
#      The distribution certificate and app-store profile have been fetched
#      through it and saved as `binary_distribution` and `binary_app_store`
#      under Code signing identities. Refresh them there after any capability
#      change, which invalidates existing profiles.
#   3. Codemagic → app settings → Build → switch the source from "Workflow
#      Editor" to "codemagic.yaml". Until this is done, THIS FILE IS IGNORED.
#   4. Nothing — APP_STORE_APP_ID is already filled in (6762030524).
#
# NOTE: a green build is necessary but NOT sufficient to ship. iOS 1.0 is
# REJECTED with four unresolved issues, three of which are not code. See
# docs/RELEASE.md "What still blocks the App Store".

workflows:

  # ───────────────────────────────────────────────────────────────────────────
  # Fast, unsigned verification. Runs the real test suite and the analyzer.
  # Use this on branches; it needs no signing assets and burns few minutes.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify (analyze + test)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        # Strict on purpose. The tree is clean at zero issues, so any new lint
        # — including info level — fails the build rather than accumulating.
        script: flutter analyze
      - name: Test
        script: flutter test --reporter expanded

  # ───────────────────────────────────────────────────────────────────────────
  # Signed iOS release → TestFlight.
  # ───────────────────────────────────────────────────────────────────────────
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Verified 2026-08-31 against Codemagic -> Settings -> Integrations ->
      # Developer Portal: the connected key is named exactly "Codemagic"
      # (Key ID 49ACZ234H8), which is the same App Store Connect API key that
      # issued the current distribution certificate. Must match exactly.
      app_store_connect: Codemagic
    environment:
      flutter: stable
      # `latest` tracks whatever Xcode Codemagic has provisioned. Pin this to a
      # specific version (e.g. `16.2`) once a build is green, so a future Xcode
      # major release cannot silently break a build months from now. Pinning to
      # a version Codemagic has retired fails instantly — only pin what you saw
      # actually work.
      xcode: latest
      cocoapods: default
      ios_signing:
        # Signing assets are referenced by the names they were saved under in
        # Codemagic -> Personal account settings -> Code signing identities.
        #
        # The first attempt used the `distribution_type` / `bundle_identifier`
        # form, which is documented to fetch and create signing assets from
        # Apple on every build. On this account it does not: two builds failed
        # instantly, before provisioning a machine, with "No matching profiles
        # found for bundle identifier com.cristians.b1nary and distribution
        # type app_store" — while Codemagic's own "Fetch profiles" dialog,
        # using the very same API key, listed that exact profile. It resolves
        # signing from the stored identities, and the store was empty.
        #
        # These are NOT the old hand-uploaded files the rewrite removed. Both
        # were pulled straight from Apple by the App Store Connect integration
        # below and are stored on the Codemagic side, so refreshing them after
        # a capability change is a button, not a laptop.
        provisioning_profiles:
          - binary_app_store
        certificates:
          - binary_distribution
      vars:
        BUNDLE_ID: "com.cristians.b1nary"
        # App Store Connect app id for B1nary Academy.
        APP_STORE_APP_ID: 6762030524
    scripts:
      - name: Get packages
        script: flutter pub get

      # A release that fails its own tests should never reach a tester's phone.
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test

      - name: Install pods
        script: |
          # ios/Podfile IS committed, and deliberately so. Without it Flutter
          # generates one from its template with the platform line commented
          # out, CocoaPods falls back to iOS 13.0, and the build dies on
          # "could not find compatible versions for pod Flutter". The
          # committed Podfile pins the platform to match
          # IPHONEOS_DEPLOYMENT_TARGET in the Xcode project.
          cd ios && pod install

      - name: Set up signing profiles on the Xcode project
        script: xcode-project use-profiles

      # App Store Connect rejects a duplicate build number, which previously
      # meant hand-editing `version:` in pubspec.yaml before every single
      # upload — and forgetting meant a wasted build. Derive it instead.
      - name: Derive the next build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo "0")
          echo "Latest build number on TestFlight: $LATEST"
          echo "NEXT_BUILD_NUMBER=$(($LATEST + 1))" >> $CM_ENV

      - name: Build the signed IPA
        script: |
          flutter build ipa --release \
            --build-number="$NEXT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Uncomment and name a real group to auto-distribute to testers.
        # beta_groups:
        #   - Internal Testers
