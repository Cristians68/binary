<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Study IT service management, Scrum, networking, security, cloud and AI with B1nary Academy. Free first modules, a seven-day course trial, recall and explained quizzes.">
  <meta name="robots" content="noindex,follow">
  <!-- Certification marks are deliberately absent here. Listing them as what
       this product delivers implies an accreditation we do not have (App Store
       Review Guideline 5.2.1) - the same reason course titles come from
       lib/course_catalog.dart. Search engines have ignored this tag for years,
       so there is no SEO cost. -->
  <meta name="keywords" content="IT certification study app, flashcards, quizzes, active recall, IT service management, agile, scrum, networking, cybersecurity, cloud, AI, machine learning">
  <meta name="theme-color" content="#325BE8">
  <meta name="author" content="B1nary">

  <!-- Fix for Google Sign-In popup COOP issue -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="B1nary Academy — Learn, recall, practice">
  <meta property="og:description" content="Seven IT courses with free first modules, a seven-day course trial, active recall and explained quizzes.">
  <meta property="og:url" content="https://binaryapp.org/app/">
  <meta property="og:image" content="https://binaryapp.org/icons/Icon-512.png">
  <meta property="og:site_name" content="B1nary">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="B1nary Academy — Learn, recall, practice">
  <meta name="twitter:description" content="Seven IT courses with free first modules, a seven-day course trial, active recall and explained quizzes.">
  <meta name="twitter:image" content="https://binaryapp.org/icons/Icon-512.png">

  <!-- iOS / PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="B1nary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>B1nary Academy — Study app</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0E1422;
    }
    /* Prevent flash of unstyled content */
    body {
      overflow: hidden;
    }
    /* Custom scrollbar for web */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
    /* Remove Flutter default focus ring on web */
    flt-glass-pane:focus { outline: none; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
