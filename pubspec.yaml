name: binary
description: "B1nary — IT certification prep with flashcards and quizzes."
publish_to: 'none'

version: 1.0.3+54

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  # Native iOS crashes (Swift fatalError, uncaught NSException, signals)
  # cannot be caught by a Dart zone. Without this the only evidence of a
  # release crash was a tester manually exporting a .ips file.
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  flutter_svg: ^2.0.10+1
  confetti: ^0.7.0
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  # UIScene support and native configuration errors returned to Dart.
  google_sign_in_ios: ^6.3.5
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  purchases_flutter: ^9.16.1
  flutter_local_notifications: ^16.3.3
  timezone: ^0.9.0
  firebase_messaging: ^15.0.0
  url_launcher: ^6.3.0
  in_app_review: ^2.0.9
  share_plus: ^13.0.0
  flutter_jailbreak_detection: ^1.10.0
  image_picker: ^1.2.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^3.1.0
  google_sign_in_platform_interface: ^3.1.0
  yaml: ^3.1.4

flutter:
  # Keep CI on the CocoaPods integration already used by this Xcode project.
  # Flutter otherwise enables Swift Package Manager by default on new machines.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/icons/
    # Inter, bundled so google_fonts never reaches fonts.gstatic.com.
    # See lib/main.dart: allowRuntimeFetching is false, which turns a
    # missing weight into a visible failure rather than a silent download.
    - google_fonts/
